name: BehavProof internal audit
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
  gate:
    needs: [evidence]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream outcome
        env:
          UPSTREAM_RESULT: ${{ needs.evidence.result }}
        run: test "$UPSTREAM_RESULT" = success
      # Use a pinned verifier installation and a separately provisioned trust root.
      # This template does not supply those prerequisites or issue an external protected check.
      - run: behavproof check --mode gate --trust-root /opt/behavproof/trust-root.json
