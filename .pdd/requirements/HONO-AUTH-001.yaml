id: HONO-AUTH-001
revision: 4
title: 管理者向け操作を許可する条件
intent: 検証済みのサーバー側本人情報が管理者かつ認証成功なら、判定関数は許可を返し、それ以外は拒否する。HTTPの入口では、この二つの認可判断用の値をクライアントのJSONや未検証のヘッダーから取得しない。
risk: high
target:
  file: examples/existing-hono/src/domain/auth.ts
  symbol: canIssueAdminToken
contracts:
  - id: HONO-AUTH-001-C1
    kind: postcondition
    human: 管理者であり、かつ認証に成功している場合だけ許可する。
    sourceRef:
      file: examples/existing-hono/src/domain/auth.ts
      symbol: canIssueAdminToken
      clause: ensures
      index: 0
    semantics: boolean-string-equality-v1
acceptance:
  - id: HONO-AUTH-001-T1
    kind: test
    scenario: 管理者かどうか・認証済みかどうかの4通りについて、実際のHonoの入口が期待する判断を返す。
  - id: HONO-AUTH-001-T2
    kind: test
    scenario: 本人情報がない場合は401とし、取得元が不正な形式の情報を返した場合も許可しない。
  - id: HONO-AUTH-001-T3
    kind: test
    scenario: 本人情報の取得で例外や非同期の失敗が起きた場合も許可せず、取得元のエラー内容を外へ漏らさない。
  - id: HONO-AUTH-001-T4
    kind: test
    scenario: クライアントのJSON・ヘッダー・クエリで、サーバー側の本人情報を上書きしたり、存在しない本人情報を作ったりできない。
trustedBoundaries:
  - HONO-AUTH-IDENTITY-PROVIDER
