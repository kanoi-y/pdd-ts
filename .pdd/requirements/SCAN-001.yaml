id: SCAN-001
revision: 1
title: 既存TypeScriptを変更せず調査し、根拠付きの構造と更新候補を示す
intent: 初期化・Git・証明ツールを要求せず、対象コードや設定を実行しない静的調査を提供する。相対パス・行・入力ハッシュを根拠に、観測・推測・未確認を区別した日本語Atlasと比較結果を返す。調査結果を仕様承認や検証ゲートの証拠にはしない。
risk: high
target:
  file: src/analysis/scan.ts
  symbol: scanProject
contracts: []
acceptance:
  - id: SCAN-001-T1
    kind: test
    scenario: 未導入プロジェクトのASTと明示したメタデータを制限内で読み取り、コードや設定を実行せずファイルを変更しない。別名importと名前の隠蔽を区別し、不明な呼び出しを確定しない。
  - id: SCAN-001-T2
    kind: test
    scenario: シンボリックリンク、表現できないパス、巨大入力、構文エラー、項目数等の上限を隠さず、不完全な調査として返す。
  - id: SCAN-001-T3
    kind: test
    scenario: 出力をエスケープし、図に未信頼の識別子を埋め込まない。Honoの返却構文から最大3フロー候補を根拠付きで示し、実行順・到達性・業務上の正しさを保証しない。
  - id: SCAN-001-T4
    kind: test
    scenario: 比較元の形式と入力ハッシュの整合性を検査し、範囲が違う場合や不完全な場合は削除を推定しない。Review Packetの更新候補は検証ゲートを変更しない。
trustedBoundaries:
  - node-filesystem-runtime
  - typescript-frontend
