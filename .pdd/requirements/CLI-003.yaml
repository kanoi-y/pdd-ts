  - id: CLI-003-T2
    kind: test
    scenario: 対象の要件と確認済み契約を説明し、欠落や未説明の信頼前提は開発側へ返す。ローカル成功をCI成功と混同せず、根拠の完全性と出力のエスケープを保つ。
