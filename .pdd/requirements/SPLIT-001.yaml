id: SPLIT-001
revision: 3
title: 総量を失わず二つに配分する
intent: 最初の配分を利用可能な総量以下に抑え、すべての数量を二つの配分に残す。公開する入口は、総量・希望量ともに256桁以下の非負の10進整数文字列だけを受け付け、二つの配分を10進整数文字列で返す。
risk: high
target:
  file: examples/greenfield-domain/src/domain/split.ts
  symbol: split
contracts:
  - id: SPLIT-001-C1
    kind: precondition
    human: 総量は0以上である。
    sourceRef:
      file: examples/greenfield-domain/src/domain/split.ts
      symbol: split
      clause: requires
      index: 0
    semantics: bigint-nonnegative-v1
  - id: SPLIT-001-C2
    kind: precondition
    human: 希望量は0以上である。
    sourceRef:
      file: examples/greenfield-domain/src/domain/split.ts
      symbol: split
      clause: requires
      index: 1
    semantics: bigint-nonnegative-v1
  - id: SPLIT-001-C3
    kind: postcondition
    human: 二つの配分はいずれも0以上である。
    sourceRef:
      file: examples/greenfield-domain/src/domain/split.ts
      symbol: split
      clause: ensures
      index: 0
    semantics: bigint-nonnegative-v1
  - id: SPLIT-001-C4
    kind: postcondition
    human: 二つの配分を足すと元の総量に等しい。
    sourceRef:
      file: examples/greenfield-domain/src/domain/split.ts
      symbol: split
      clause: ensures
      index: 1
    semantics: bigint-conservation-v1
acceptance:
  - id: SPLIT-001-T1
    kind: test
    scenario: 実際の純粋関数が、希望量の超過、0、総量と同じ量を扱い、JavaScriptのnumberの精度を超える数量も保存する。
  - id: SPLIT-001-T2
    kind: test
    scenario: 公開する入口が10進整数文字列を検査・変換し、256桁の上限を含め、数量を失わずに文字列へ戻す。
  - id: SPLIT-001-T3
    kind: test
    scenario: 負数、不正な形式、暗黙変換できてしまう値、欠落、大きすぎる値を、純粋関数へ渡す前に拒否する。
trustedBoundaries:
  - SPLIT-DECIMAL-INPUT
