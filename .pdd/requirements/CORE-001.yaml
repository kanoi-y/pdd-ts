id: CORE-001
revision: 5
title: Complete required evidence before a passing gate
intent: A required evidence item is acceptable only when it exists uniquely,
  matches its scope and evidence kind, passed, is fresh, has valid provenance
  and has the approvals required by the evaluation mode. No empty obligation set
  may pass.
risk: high
target:
  file: src/verification/acceptance.ts
  symbol: canAcceptEvidence
contracts:
  - id: CORE-001-C1
    kind: postcondition
    human: Acceptance is equivalent to the conjunction of all required checks.
    sourceRef:
      file: src/verification/acceptance.ts
      symbol: canAcceptEvidence
      clause: ensures
      index: 0
    semantics: bool-conjunction-v1
acceptance:
  - id: CORE-001-T1
    kind: test
    scenario: Missing, duplicate, skipped, zero-case, wrong-kind, stale and
      unauthenticated evidence each blocks the gate.
trustedBoundaries: []
