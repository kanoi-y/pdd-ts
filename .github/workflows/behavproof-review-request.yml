name: Open BehavProof consumer review
on:
  push:
    branches: [codex/behavproof-review-request]
permissions:
  contents: read
  pull-requests: write
jobs:
  open-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Open review without candidate execution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo='kanoi-y/pdd-ts'
          if os.environ['GITHUB_REPOSITORY'] != repo:
              raise SystemExit('Unexpected repository')
          def api(path, data=None):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          head='codex/behavproof-publisher-cli-launch'
          branch=api('/branches/'+head)
          if branch['commit']['sha'] != '149009a060e0f3011fb0407db2d497914e34f3bd':
              raise SystemExit('Review source changed')
          result=api('/pulls',json.loads("{\"head\":\"codex/behavproof-publisher-cli-launch\",\"base\":\"main\",\"draft\":true,\"title\":\"BehavProof最終gateのCLI実行リンクをビルド後に作成する\",\"body\":\"実地検証で、収集・照合・App認証の成功後に最終CLIが `command not found`（exit 127）で停止しました。ビルド前の `npm ci --ignore-scripts` 時点にはdistが無く、workspaceの実行リンクが作成されないためです。\\n\\n変更は `.github/workflows/behavproof-publisher.yml` のgateジョブに、ビルド直後の `npm rebuild @behavproof/cli --ignore-scripts --offline` を1行追加するだけです。SDK a94329e61bd0a56141b5f6c9f9156b9aa3b29b56と承認済み契約・Policyは維持します。最終gate条件・失敗時の専用チェック・main保護・App鍵の利用範囲は変えません。\\n\\nBehavProof側で実CLI起動の回帰テストを追加し、修正前127→修正後help成功を確認。独立レビューも同じ再現とlifecycle hooksが実行されないことを確認しました。全体CIの完了後にreadyへ変更します。\\n\\nmain統合後は、承認登録e236を維持し、保護ワークフローSHAを統合後のmainへ更新して正常系と負例を再実行します。実地での最終成功は未確認です。\"}"))
          print(result['html_url'])
          PY
