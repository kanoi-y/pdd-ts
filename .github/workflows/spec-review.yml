name: Prepare human specification review
on:
  workflow_dispatch:
permissions: {}
jobs:
  prepare:
    name: Request exact-head human review
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.1'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --store-dir .tools/pnpm-store
      - run: pnpm build
      # The fixed existing review branch is fetched as inert data, never checked out or executed.
      # Only this step receives the PR-creation token; no human review is automated.
      - run: node scripts/prepare-spec-review.mjs
        env:
          GH_TOKEN: ${{ github.token }}
