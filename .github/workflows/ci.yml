name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Build, proof and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.1'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --store-dir .tools/pnpm-store
      - run: node scripts/install-dafny.mjs
      - run: pnpm check
      - run: pnpm test:poc
      - run: node scripts/demo.mjs
      - run: node scripts/demo-negative.mjs
      - run: node scripts/package-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-trial-evidence
          path: |
            .pdd/reports/
            docs/evidence/p0-results.json
          include-hidden-files: true
          if-no-files-found: error
